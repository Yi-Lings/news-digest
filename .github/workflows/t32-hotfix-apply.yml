name: apply-t32-fallback-hotfix

on:
  push:
    branches: [hotfix/t32-fallback-start-limit]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: hotfix/t32-fallback-start-limit
      - name: Apply verified fallback hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("deploy/systemd/news-digest-resume.service")
          text = service.read_text()
          old = """StartLimitIntervalSec=15min\nStartLimitBurst=4\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/flock -E 75 -n /run/news-digest-worker.lock /usr/bin/docker compose -f /srv/news-digest/compose.yaml run --rm worker resume-automation --yes\n# Same bounded multi-attempt budget as the daily worker.\nTimeoutStartSec=24h\nSuccessExitStatus=10\nRestart=on-failure\nRestartPreventExitStatus=10\nRestartSec=15s\n"""
          new = """StartLimitIntervalSec=0\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/flock -E 75 -n /run/news-digest-worker.lock /usr/bin/docker compose -f /srv/news-digest/compose.yaml run --rm worker resume-automation --yes\n# Same bounded multi-attempt budget as the daily worker.\nTimeoutStartSec=24h\nSuccessExitStatus=10 75\n# Retries are owned by news-digest-wakeup.timer; avoid service-level restart storms\n# and do not let frequent successful fallback invocations consume a start-limit budget.\nRestart=no\n"""
          if old not in text:
              raise SystemExit("resume service source did not match expected T32 unit")
          service.write_text(text.replace(old, new))

          test = Path("tests/unit/test_release_deploy_artifacts.py")
          text = test.read_text()
          old = """    assert \"Restart=on-failure\" in resume_service\n    assert \"SuccessExitStatus=10\" in daily_service\n    assert \"SuccessExitStatus=10\" in resume_service\n    assert \"RestartPreventExitStatus=10\" in resume_service\n"""
          new = """    assert \"Restart=no\" in resume_service\n    assert \"StartLimitIntervalSec=0\" in resume_service\n    assert \"SuccessExitStatus=10\" in daily_service\n    assert \"SuccessExitStatus=10 75\" in resume_service\n    assert \"RestartPreventExitStatus=10\" not in resume_service\n"""
          if old not in text:
              raise SystemExit("release test source did not match expected T32 assertions")
          test.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/t32-hotfix-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/systemd/news-digest-resume.service tests/unit/test_release_deploy_artifacts.py
          git commit -m "fix: prevent fallback resume start-limit exhaustion"
          git push origin HEAD:hotfix/t32-fallback-start-limit
