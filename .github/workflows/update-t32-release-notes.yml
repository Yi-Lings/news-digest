name: update-t32-release-notes

on:
  push:
    branches:
      - hotfix/t32-fallback-start-limit

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Update v1.4.0t32 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## v1.4.0t32 — Controlled Provider Recovery & Worker Console

          T32 focuses on **safe manual provider recovery, durable Admin actions, worker self-healing, and production observability**. Cross-provider failover remains human-controlled: the system never silently switches providers on its own.

          ### What changed

          - **Human-controlled provider recovery**
            - A provider can become default only after the current exact configuration has a successful manual test.
            - `立即探测`, `重试`, per-article recovery, and edition recovery target the **current validated default provider**.
            - Switching providers does not mutate historical tasks. T32 creates a new provider-bound task and preserves the old task plus `rebind_from_task_id` lineage for auditability.
            - Circuit-open recovery uses a controlled half-open probe instead of bypassing the circuit breaker.

          - **Durable Admin actions and reliable wake-up**
            - Admin actions are persisted to SQLite before execution and have explicit terminal states instead of remaining permanently `requested`.
            - Fast path: `news-digest-wakeup.path` reacts to `/srv/news-digest/config/automation.wake`.
            - Fallback path: `news-digest-wakeup.timer` invokes the resume worker every 30 seconds, so a missed filesystem event cannot strand a durable action.
            - Duplicate manual probe/retry actions are bounded and idempotent.

          - **Worker and task observability**
            - Added persistent worker runtime status / heartbeat data.
            - Admin can surface `account-mail-1`, `account-mail-2`, `payment-reconcile`, automation/resume, and translation execution state.
            - Translation tasks expose real stage-based progress rather than elapsed-time estimates.
            - Edition view separates **translation progress** from **online/publication progress**.

          - **Persistent worker self-healing**
            - Account-mail workers now recover from transient SQLite `OperationalError` instead of silently dying while the container remains healthy.
            - A supervisor detects unexpected persistent-worker exits and safely recreates them with bounded restart behavior.
            - Business-worker health is kept separate from Docker container liveness.

          - **Database / recovery model**
            - Production schema upgraded to **v13**.
            - Provider rebind lineage and expanded Admin-action execution metadata are persisted for audit and recovery.
            - Historical translation/provider records remain immutable.
            - Recovery never retranslates already-successful items and does not resend historical newsletter mail.

          ### T32 fallback hotfix

          Production validation exposed one host-systemd edge case: a 30-second fallback timer could exhaust the old `news-digest-resume.service` start-limit budget even when prior oneshot runs had succeeded.

          Fixed in PR #2 / main commit `d35ebba794466f9e664829f84a840b3309724b66`:

          ```ini
          StartLimitIntervalSec=0
          SuccessExitStatus=10 75
          Restart=no
          ```

          The timer now owns retry cadence; lock contention (`flock` exit 75) is treated as a normal skip, and the oneshot service no longer creates a service-level restart storm.

          > **Artifact note:** the `v1.4.0t32` container images/assets were built from application commit `22315fda72dd74794f44c3538c0968dce18c8b6e`. PR #2 is a **host systemd-unit-only hotfix** merged after those assets were produced. Production already has the corrected unit. For a fresh/manual T32 deployment from this prerelease bundle, also use the current `deploy/systemd/news-digest-resume.service` from `main`, or use the next candidate release that includes it in the bundle.

          ### Production validation — 2026-09-13

          Final production acceptance passed after applying the systemd hotfix:

          - Site / Admin / Web containers: **healthy**
          - Public homepage and `issues/2026-09-13/`: **HTTP 200**
          - SQLite: `PRAGMA quick_check = ok`
          - Application schema: **v13**
          - 2026-09-13 edition: **6/6 translated, 6/6 online**
          - All six translation tasks: **succeeded on attempt 1**
          - Current provider circuit: **closed**, 0 consecutive failures, last outcome `success`
          - `account-mail-1`, `account-mail-2`, `payment-reconcile`: **live heartbeats, no worker error**
          - Open Admin actions (`requested` / `claimed` / `running`): **0**
          - Recent Site/Admin/Web logs: **no new matching error / traceback / readonly-DB / OOM events**
          - `news-digest-wakeup.path`: **active / waiting**
          - `news-digest-wakeup.timer`: **active / waiting**
          - `news-digest-resume.service`: repeated fallback runs **Result=success / ExecMainStatus=0**, with `StartLimitIntervalUSec=0`
          - Fast-path smoke test confirmed `PathChanged` starts the resume worker independently of the 30-second timer; the following timer cycle also completed successfully.

          The production account-mail workers that had previously died are now restored and supervised. An old expired registration-code outbox entry was correctly terminated as `CODE_INACTIVE` rather than being sent after recovery.

          ### Release artifacts

          The prerelease contains:

          - `digests.env` — immutable worker/web image digests
          - `news-digest-deploy.tgz` — deployment bundle
          - `news-digest-deploy.tgz.sha256` — bundle checksum

          Worker image digest used by production:
          `sha256:0a0db7b082bd59dfb2905420c6282ff1082734ad796b6c1c712e9dc406d51004`

          Web image digest used by production:
          `sha256:cd714f685de2a5fdd289423a6c28cb189e3e2d46844e00c25d4886e2ff4fd26e`

          ### Operational notes

          - `NO_ELIGIBLE_RECIPIENTS` is a delivery result meaning no current recipients were eligible; it is **not** a publication failure.
          - Provider switching remains deliberately manual. T32 improves recovery execution and visibility; it does not introduce automatic cross-provider failover.
          - Production upgrade backups and rollback points were created and verified before schema/image cutover.

          **Production status: T32 accepted.**
          EOF
          gh release edit v1.4.0t32 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v1.4.0t32 — Controlled Provider Recovery & Worker Console" \
            --notes-file /tmp/release-notes.md \
            --prerelease
