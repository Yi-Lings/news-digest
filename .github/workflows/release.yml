# ---------------------------------------------------------------------------
# 发布流水线（阶段 7）：只在推送 v* 版本 tag 时运行。
# 链路：Linux 上复跑完整离线测试（兼作 Windows 开发 / Linux 生产的平台差异守门）
#       → 通过后 buildx 构建 worker/web 两个镜像并推送私有 GHCR
#       → 输出不可变 digest，供服务器 compose 固定引用。
# 不使用 latest tag；测试与构建使用同一提交中的同一 uv.lock（PLAN 阶段 7 验收标准）。
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags:
      - "v*"

# 默认最小权限；只有 build job 单独追加 packages:write
permissions:
  contents: read

env:
  # 构建架构必须与服务器 CPU 一致（部署前用 `uname -m` 核验；
  # x86_64 → linux/amd64，aarch64 → linux/arm64）。只改这一处即可。
  PLATFORMS: linux/amd64

jobs:
  test:
    # 固定 runner 版本而不用 ubuntu-latest：发布链路的每个环节版本都要可复现
    runs-on: ubuntu-24.04
    outputs:
      release_channel: ${{ steps.version.outputs.release_channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # uv 固定为与本地开发一致的版本（PLAN.md 环境表），锁文件解析行为完全相同
      - name: 安装 uv 0.11.28
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"

      - name: 安装 .python-version 指定的 Python
        run: uv python install

      # --locked：uv.lock 与 pyproject.toml 不一致时直接失败，而不是悄悄重解析
      - name: 同步依赖
        run: uv sync --locked

      - name: Ruff 检查
        run: uv run ruff check .

      # pyproject 的 addopts 默认排除 network 标记，CI 里即离线套件
      - name: 离线测试套件
        run: uv run pytest

      # 稳定 tag 必须与包内 __version__ 完全一致；同版本测试候选只允许追加 tN。
      # 例如包版本 1.4.0 可发布 v1.4.0 或 v1.4.0t1，但不能发布 v1.4.1t1。
      - name: 校验稳定 tag 或测试候选 tag
        id: version
        run: |
          pkg_version="$(uv run python -c 'import news_digest; print(news_digest.__version__)')"
          stable_tag="v${pkg_version}"
          candidate_prefix="${stable_tag}t"
          if [ "${GITHUB_REF_NAME}" = "${stable_tag}" ]; then
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+t[1-9][0-9]*$ ]] && \
               [[ "${GITHUB_REF_NAME}" == "${candidate_prefix}"* ]]; then
            echo "release_channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag ${GITHUB_REF_NAME} 必须是 ${stable_tag} 或 ${stable_tag}tN（N 从 1 开始）"
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # 推送 GHCR 所需的唯一附加权限
    outputs:
      # 供发布记录/后续 job 引用；部署时以此 digest 固定 compose（PLAN §10）
      worker-digest: ${{ steps.push-worker.outputs.digest }}
      web-digest: ${{ steps.push-web.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # GHCR 仓库路径必须全小写；用户名含大写时不能直接用 github.repository_owner
      - name: 计算镜像仓库前缀
        id: vars
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance 显式关闭：默认的 provenance attestation 会把推送产物变成
      # image index（多条 manifest），人工按 digest 固定部署时容易拿错；
      # 单一 manifest 的 digest 最直白，可追溯性已由 OCI labels 承担。
      # tag 策略：版本 tag + 完整 commit sha，两者都推，不推 latest。
      - name: 构建并推送 worker 镜像
        id: push-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/news-digest-worker:${{ github.ref_name }}
            ${{ steps.vars.outputs.image_prefix }}/news-digest-worker:sha-${{ github.sha }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: 构建并推送 web 镜像
        id: push-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/news-digest-web:${{ github.ref_name }}
            ${{ steps.vars.outputs.image_prefix }}/news-digest-web:sha-${{ github.sha }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      # 把可直接粘贴进 compose.yaml 的 digest 引用写进运行摘要，
      # 部署时从这里复制，不必翻查 registry
      - name: 输出镜像 digest
        run: |
          {
            echo "## 发布镜像（复制整段引用到 /srv/news-digest/compose.yaml 的 image 字段）"
            echo ""
            echo "| 服务 | 引用 |"
            echo "|---|---|"
            echo "| worker | \`${{ steps.vars.outputs.image_prefix }}/news-digest-worker@${{ steps.push-worker.outputs.digest }}\` |"
            echo "| web | \`${{ steps.vars.outputs.image_prefix }}/news-digest-web@${{ steps.push-web.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 一键部署包：deploy/ 打包为 Release 附件，服务器端 install.sh 一条命令即可部署
  release-bundle:
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ needs.test.outputs.release_channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 打包部署工件
        # 拍平 systemd/nginx 子目录：bootstrap.sh 按扁平布局查找工件
        # （与 server-push.ps1 的上传布局一致）；Windows 侧编排脚本不入包
        run: |
          cat > digests.env <<EOF
          ND_VERSION=${GITHUB_REF_NAME}
          ND_WORKER_DIGEST=${{ needs.build.outputs.worker-digest }}
          ND_WEB_DIGEST=${{ needs.build.outputs.web-digest }}
          EOF
          cp digests.env deploy/digests.env
          tar -czf news-digest-deploy.tgz \
            --transform='s|^deploy/systemd/|deploy/|;s|^deploy/nginx/|deploy/|' \
            --exclude='deploy/server-push.ps1' \
            --exclude='deploy/deploy-all.ps1' \
            deploy/
          sha256sum news-digest-deploy.tgz > news-digest-deploy.tgz.sha256

      - name: 创建 Release 并上传部署包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = "prerelease" ]; then
            release_status=(--prerelease --latest=false)
            release_notes="测试候选：仅用于受控验收；使用同一 Release 的 immutable digest 按 deploy/README.md 部署。"
          else
            release_status=(--prerelease=false --latest)
            release_notes="一键部署：见 deploy/README.md 的「一键部署」章节；附件为服务器端部署包。"
          fi

          # 显式区分「已存在→修正发布状态并补传」与「不存在→创建」，
          # 避免 || 兜底掩盖真实错误。测试候选永远不成为 releases/latest。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${release_status[@]}"
            gh release upload "$GITHUB_REF_NAME" \
              news-digest-deploy.tgz news-digest-deploy.tgz.sha256 digests.env --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "$release_notes" "${release_status[@]}" \
              news-digest-deploy.tgz news-digest-deploy.tgz.sha256 digests.env
          fi
