# ---------------------------------------------------------------------------
# news-digest 生产 Compose（阶段 7 源码侧模板；未经服务器实测不视为最终版）
# 放置位置：/srv/news-digest/compose.yaml
#
# 镜像引用规则（PLAN §10：生产固定不可变 digest，不使用 latest）：
# - 部署时必须把下方 image 改为 digest 形式，例如：
#     image: ghcr.io/OWNER/news-digest-worker@sha256:DIGEST
#     image: ghcr.io/OWNER/news-digest-web@sha256:DIGEST
#   注意 worker 镜像出现两处（worker 与 admin 服务共用同一引用），须一并替换；
#   经 bootstrap.sh 渲染时两处自动同步。
#   DIGEST 从 release.yml 的 Actions 运行摘要复制，或用
#   `docker buildx imagetools inspect` 查询——具体步骤见 deploy/README.md。
# - 下方 tag 写法（:VERSION）仅为占位与可读性示例；tag 可被覆盖，不得用于生产。
# - 本文件不含 build、不挂源码：服务器只拉取 GHCR 已发布镜像（PLAN 发布链路）。
# ---------------------------------------------------------------------------

# 固定项目名：卷名从而固定为 news-digest_news-data / news-digest_news-site，
# 备份与回滚脚本不受部署目录名影响
name: news-digest

services:
  worker:
    # 部署时替换为 @sha256:DIGEST（见文件头注释；OWNER/VERSION 为占位符）
    image: ghcr.io/OWNER/news-digest-worker:VERSION
    user: "10001:10001"
    # 一次性任务：由 systemd timer 经 `docker compose run --rm worker` 触发。
    # 不常驻、失败不自动重启——避免翻译 API 重复计费；停机漏跑由 timer 的
    # Persistent=true 补跑，而不是靠容器重启策略
    restart: "no"
    # 一次性任务用 init 收割子进程、正确转发信号
    init: true
    env_file:
      # 生产密钥唯一注入点；文件必须 root 所有、权限 600（README 有创建步骤）。
      # 位于 config/ 子目录：与 providers.json、面板口令等一起构成 admin 容器
      # 唯一可触及的宿主路径（见 admin 服务的 volumes 注释）。
      # 注意：.env 中不得设置 NEWS_DATA_DIR / NEWS_OUTPUT_PATH / NEWS_DATABASE_PATH，
      # 这三项已在镜像内固定为卷挂载点，覆盖会写到只读路径导致任务失败
      - /srv/news-digest/config/.env
    environment:
      # 生产翻译以 providers.json 的唯一默认档案为权威源；.env 中 TRANSLATION_*
      # 仅作迁移兼容，不得在无默认档案时静默回退。
      TRANSLATION_PROVIDERS_FILE: /config/providers.json
    # 只读根文件系统：可写面收敛到 /tmp（tmpfs）与两个数据卷
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # PLAN §11 初始内存上限，观察实测峰值后再调整
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        # 容器侧日志轮转，防止长期运行占满磁盘
        max-size: "10m"
        max-file: "3"
    volumes:
      - /srv/news-digest/config:/config:ro
      - news-data:/data   # SQLite、抓取快照、翻译缓存、邮件归档
      - news-site:/site   # releases/ + current 符号链接（发布器原子切换）

  web:
    # 部署时替换为 @sha256:DIGEST（见文件头注释）
    image: ghcr.io/OWNER/news-digest-web:VERSION
    restart: unless-stopped
    ports:
      # 只绑宿主机回环地址：公网入口统一经宿主机 Nginx（TLS、认证、限速、安全头）
      # 宿主侧 8618（服务器 8080 已被既有服务占用）；容器内 nginx 仍监听 8080
      - "127.0.0.1:8618:8080"
    read_only: true
    tmpfs:
      # nginx 的 pid 与临时目录都指向 /tmp（见 Dockerfile.web 内联配置）
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 32m
    pids_limit: 64
    healthcheck:
      # /healthz 在容器 nginx 内直接返回 200，不依赖站点内容是否已生成
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 站点卷对 web 只读：写入只发生在 worker，一次性任务失败不会破坏在线站点
      - news-site:/site:ro

  admin:
    # 生产模型切换面板（news-digest admin）：复用 worker 镜像——面板与流水线是
    # 同一份代码、同一个 digest，部署时与 worker 的 image 一并替换（见文件头注释）
    image: ghcr.io/OWNER/news-digest-worker:VERSION
    entrypoint: ["/bin/sh", "-c"]
    command: ["umask 0002; exec news-digest admin --port 8619 --config-dir /config"]
    # 面板服务端在代码里硬绑 127.0.0.1（安全设计：密钥面板绝不监听非回环地址）。
    # bridge 网络下 ports 映射的流量到达的是容器 eth0，会被这一回环绑定拒绝，
    # 因此用 host 网络——效果恰好就是需求本身：只监听宿主机 127.0.0.1:8619，
    # 公网入口唯一经宿主机 Nginx 的 /admin/（认证由面板自身的登录页 + 会话
    # Cookie 承担，nginx 只反代不做 Basic Auth，见 nginx/news.conf）
    network_mode: host
    # 镜像默认以 uid 10001 运行；/config 下 .env 保持 root:root/600，而
    # providers.json 为 worker 可读的 root:10001/640。面板要原地读写它们，必须
    # 以容器 root UID 运行。共享 GID 固定为
    # worker 的 10001，并以 umask 0002 启动，确保面板首次创建的 SQLite/journal
    # 仍可由非 root worker 写入。风险由 cap_drop ALL、no-new-privileges、只读根
    # 文件系统与仅回环监听共同收敛。
    user: "0:10001"
    # 常驻服务，意外退出自动拉起：面板与 worker 的一次性语义不同，重启无重复计费问题
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 32m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 只挂 config/ 子目录而非整个部署目录：admin 容器可写面收窄到自身的配置
      # 文件（.env、providers.json、htpasswd-admin、session-secret、
      # admin-password.initial），不再能改写 compose.yaml 与运维脚本——即使面板
      # 被攻破也不存在借部署工件提权的路径。bootstrap 渲染时把 /srv/news-digest
      # 全局替换为 APP_DIR 的机制保持不变，本行同样被渲染。
      # 必须 bind 挂「目录」而不是单个文件：配置保存一旦走「写临时文件 → 原子替换」
      # 路径，文件 inode 就会变化，而单文件 bind 钉住的是旧 inode，此后宿主与容器
      # 将各自持有不同文件、互相看不见改动；且 providers.json 首次启动时可能尚不
      # 存在（单文件 bind 会被 Docker 误建成目录）。挂目录后目录项更新对两侧即时可见。
      - /srv/news-digest/config:/config
      # 公开订阅与确认/退订共用 worker 的 SQLite 数据；只增加既有 named volume，
      # 不扩大可写宿主 bind 面。
      - news-data:/data
      # 邮件预览、投递状态与指定刊期人工发送只读取不可变 release manifest；
      # Admin 不得改写已发布站点。
      - news-site:/site:ro
    # 面板改写 /config/.env 后不需要重启任何服务：worker 是一次性容器，每次由
    # systemd timer 经 `docker compose run` 拉起时都重新读取 env_file，下一期即
    # 生效；web 不读 .env；面板自身对配置文件按请求即读即写，也没有缓存。

volumes:
  news-data:
  news-site:
