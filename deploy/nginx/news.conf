# news.example.com —— 宿主机 Nginx 反向代理模板
# 放置位置：/etc/nginx/conf.d/news.conf（或 sites-available + 软链，二者都在 http 上下文内 include）
# 首次部署顺序（详见 deploy/README.md）：证书签发前先注释整个 443 server 块，
# 否则 ssl_certificate 文件不存在会导致 nginx -t 失败。

# 限速 zone 必须定义在 http 上下文（conf.d 文件顶层即是）。
# 10r/s + burst 20 对单人使用的静态站绰绰有余，主要挡扫描器和无脑爬虫。
limit_req_zone $binary_remote_addr zone=news_ratelimit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=news_subscribe_ratelimit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name news.example.com;

    # certbot webroot 验证路径：签发与续期都不必停站
    # （需先 mkdir -p /var/www/certbot，属主给 nginx 运行用户可读）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余流量一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 宿主机 nginx >= 1.25.1 时取消下一行注释启用 HTTP/2（旧版语法 `listen ... http2` 已废弃）
    # http2 on;
    server_name news.example.com;

    # certbot 标准路径：certbot certonly --webroot 签发后自动存在
    ssl_certificate     /etc/letsencrypt/live/news.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 现代客户端自行选择最优套件即可，不强制服务端偏好
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:news_ssl:1m;
    ssl_session_timeout 1h;

    # ---- 访问保护 ----
    # 用户决定（2026-07-26）：站点公开访问，不启用 Basic Auth；
    # 依赖 noindex + 不对外宣传控制曝光。如日后要加回：
    #   sudo htpasswd -B -c /etc/nginx/htpasswd-news 用户名
    #   并取消注释下面两行。
    # auth_basic "news-digest";
    # auth_basic_user_file /etc/nginx/htpasswd-news;
    # 例外：/admin/ 模型切换面板必须口令（安全底线：公开的是「看」，
    # 能改生产配置的入口必须有认证）——见下方独立 location。

    # ---- 限速 ----
    limit_req zone=news_ratelimit burst=20 nodelay;
    limit_req_status 429;

    # ---- 安全响应头 ----
    # always：错误响应（含 401/404）也要带上这些头。
    # 注意：nginx 的 add_header 在 location 内一旦出现会整体覆盖上层，
    # 因此本配置把所有 add_header 集中在 server 层，location 内不再添加。
    # 私人站点不进搜索引擎：
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：img-src 放行 https: 供新闻来源图片，data: 供站点生成的注册图形验证码；
    # style-src 需要 'unsafe-inline'（模板含少量内联样式）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" always;
    # HSTS 故意先不开：等 HTTPS 与证书续期稳定运行一段时间后再启用，避免早期失误被浏览器长期缓存
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 模型切换面板（admin 服务，仅监听宿主机 127.0.0.1:8619）----
    # 面板可修改生产翻译配置（站点其余部分保持公开）。认证由面板自身的网页
    # 登录页承担：会话 Cookie + apr1 口令哈希（部署目录 config/htpasswd-admin，
    # bootstrap 首次生成、可在面板网页修改），nginx 层不再做 Basic Auth。
    # 登录爆破由应用层恒定失败延迟 + 本 server 的 limit_req 共同抑制。
    # 面板服务端另有兜底：只监听回环地址、密钥不经网页传输（页面只见掩码）、
    # 非 /admin 路径一律 404。
    location /admin/ {
        proxy_pass http://127.0.0.1:8619;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        # Probe is capped at 15s; SMTP/manual delivery can process recipients
        # sequentially. Keep a long operator-action window so nginx does not return
        # 504 while the authenticated backend can still complete a real send.
        proxy_read_timeout 45m;
        # 面板页面的脚本为内联实现，server 层 CSP（default-src 'self'）会拦截它导致
        # 登录/切换全部失效——本 location 单独放行内联脚本（面板有登录门槛，风险可受控）。
        # 注意 nginx 的 add_header 继承规则：location 内一旦出现即整体覆盖 server 层，
        # 因此其余安全头需在此原样重复。
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 手输 /admin（无斜杠）时补上斜杠，落入上面的受保护 location；
    # 301 本身不含内容，无需认证即可返回
    location = /admin {
        return 301 /admin/;
    }

    # EasyPay adapter 的固定异步回调属于 site 支付域；必须用精确匹配覆盖下面
    # /subscribe/api/ 的 Admin 订阅前缀，否则回调会被错误转发到 8619。
    location = /subscribe/api/payment/easypay {
        proxy_pass http://127.0.0.1:8620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ---- 公开订阅、确认与退订（不受 Admin 登录保护）----
    location /subscribe/api/ {
        limit_req zone=news_subscribe_ratelimit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8619;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        # Confirmation mail has a 30s application hard deadline.
        proxy_read_timeout 35s;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /subscribe/confirm/ {
        access_log off;
        limit_req zone=news_subscribe_ratelimit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8619;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /unsubscribe/ {
        access_log off;
        limit_req zone=news_subscribe_ratelimit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8619;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ---- 反向代理到 site 容器（compose 绑定宿主回环 8620）----
    # site 负责静态文件、账号会话、验证码和付费墙；完整正文只在其授权响应中返回。
    location / {
        proxy_pass http://127.0.0.1:8620;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 静态站响应应当毫秒级返回；超时收紧，后端异常尽快暴露 502 而不是悬挂连接
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
