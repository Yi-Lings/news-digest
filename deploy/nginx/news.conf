# news.cheapcoding.top —— 宿主机 Nginx 反向代理（阶段 7 源码侧模板，服务器实测前不视为最终版）
# 放置位置：/etc/nginx/conf.d/news.conf（或 sites-available + 软链，二者都在 http 上下文内 include）
# 首次部署顺序（详见 deploy/README.md）：证书签发前先注释整个 443 server 块，
# 否则 ssl_certificate 文件不存在会导致 nginx -t 失败。

# 限速 zone 必须定义在 http 上下文（conf.d 文件顶层即是）。
# 10r/s + burst 20 对单人使用的静态站绰绰有余，主要挡扫描器和无脑爬虫。
limit_req_zone $binary_remote_addr zone=news_ratelimit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name news.cheapcoding.top;

    # certbot webroot 验证路径：签发与续期都不必停站
    # （需先 mkdir -p /var/www/certbot，属主给 nginx 运行用户可读）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余流量一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 宿主机 nginx >= 1.25.1 时取消下一行注释启用 HTTP/2（旧版语法 `listen ... http2` 已废弃）
    # http2 on;
    server_name news.cheapcoding.top;

    # certbot 标准路径：certbot certonly --webroot 签发后自动存在
    ssl_certificate     /etc/letsencrypt/live/news.cheapcoding.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.cheapcoding.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 现代客户端自行选择最优套件即可，不强制服务端偏好
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:news_ssl:1m;
    ssl_session_timeout 1h;

    # ---- 访问保护 ----
    # 用户决定（2026-07-26）：站点公开访问，不启用 Basic Auth；
    # 依赖 noindex + 不对外宣传控制曝光。如日后要加回：
    #   sudo htpasswd -B -c /etc/nginx/htpasswd-news 用户名
    #   并取消注释下面两行。
    # auth_basic "news-digest";
    # auth_basic_user_file /etc/nginx/htpasswd-news;

    # ---- 限速 ----
    limit_req zone=news_ratelimit burst=20 nodelay;
    limit_req_status 429;

    # ---- 安全响应头 ----
    # always：错误响应（含 401/404）也要带上这些头。
    # 注意：nginx 的 add_header 在 location 内一旦出现会整体覆盖上层，
    # 因此本配置把所有 add_header 集中在 server 层，location 内不再添加。
    # 私人站点不进搜索引擎：
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：站点为纯静态自托管资源；img-src 放行 https: 是因为新闻图片直接引用来源站远程地址；
    # style-src 需要 'unsafe-inline'（模板含少量内联样式）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https:; style-src 'self' 'unsafe-inline'" always;
    # HSTS 故意先不开：等 HTTPS 与证书续期稳定运行一段时间后再启用，避免早期失误被浏览器长期缓存
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 反向代理到 web 容器（compose 仅绑 127.0.0.1:8080）----
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 静态站响应应当毫秒级返回；超时收紧，后端异常尽快暴露 502 而不是悬挂连接
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
